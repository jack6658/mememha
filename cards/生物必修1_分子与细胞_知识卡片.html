<script>
/* Card login gate + per-file cloud save. Uses the same identity/config as search.html. */
(function(){
  document.documentElement.style.opacity='0';
  var cfg={url:'https://llyzyvkydvcvlcnnvpox.supabase.co',key:'sb_publishable_5GqnvHgsRqQGasfcht5j6Q_taOzntOP'};
  var uid=localStorage.getItem('lb_uid'), appId=decodeURIComponent(location.pathname.split('/').pop()||'card.html');
  var client=null, last='';
  function goLogin(){location.replace('../search.html');}
  function safeState(){var s={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k!=='lb_uid')s[k]=localStorage.getItem(k);}return s;}
  function fingerprint(s){try{return JSON.stringify(s);}catch(e){return '';}}
  async function boot(){
    if(!uid||!window.supabase){goLogin();return;}
    try{
      client=window.supabase.createClient(cfg.url,cfg.key);
      var u=await client.from('users').select('user_id').eq('user_id',uid).single();
      if(u.error||!u.data){localStorage.removeItem('lb_uid');goLogin();return;}
      var r=await client.from('user_saves').select('state').eq('user_id',uid).eq('app_id',appId).maybeSingle();
      if(r.data&&r.data.state&&typeof r.data.state==='object'){Object.keys(r.data.state).forEach(function(k){if(k!=='lb_uid')localStorage.setItem(k,r.data.state[k]);});}
      last=fingerprint(safeState()); document.documentElement.style.opacity='';
      setInterval(sync,false); window.addEventListener('pagehide',function(){sync(true);});
    }catch(e){console.warn('card auth/sync failed',e);goLogin();}
  }
  async function sync(force){if(!client||!uid)return;var state=safeState(),now=fingerprint(state);if(!force&&now===last)return;last=now;try{await client.from('user_saves').upsert({user_id:uid,app_id:appId,state:state},{onConflict:'user_id,app_id'});}catch(e){console.warn('cloud save failed',e);}}
  boot();
})();
</script>

    "结构层次：一级（序列）→ 二级（α螺旋/β折叠）→ 三级（空间折叠）→ 四级（亚基组装）。",
    '<b class="g">多样性根本原因</b>：氨基酸种类、数量、排列顺序、空间结构不同。',
    "功能分类：催化（酶）、运输（血红蛋白）、免疫（抗体）、调节（胰岛素）、结构（胶原蛋白）。"
  ]},{ty:"kao",title:"🏆 高频变式 · 计算",items:[
    '<b class="hl">脱水缩合计算</b>：n个氨基酸 → (n-1)个肽键、(n-1)个水、游离氨基/羧基各至少1个',

    "相对分子质量 = Σ氨基酸质量 - 18×肽键数"
  ]},{ty:"nan",title:"🎯 难点突破",items:[
    '<b class="hl">变性与变性复性</b>：高温/强酸碱/重金属/有机溶剂破坏氢键等非共价键 → 空间结构破坏 → 功能丧失。',
    "条件适宜可复性（核酸变性不可逆对比）。",
    "变性不破坏肽键，双缩脲反应仍阳性。"
  ]}]

    "化学组成：脂质~50%（磷脂为骨架）、蛋白质~40%（转运/受体/酶/识别）、糖类2%~10%（糖被）。",

  ]}]

  no:12,sec:"专题四 能量供应和利用",t:"ATP · 直接能源物质",

    "ATP合成场所：细胞质基质、线粒体、叶绿体类囊体薄膜。",
    'ATP→ADP的转化<b class="r">不是可逆反应</b>（条件、酶、场所不同）。'
  ]}]

function toggleTheme(){
  const h=document.documentElement;
  if(h.getAttribute('data-theme')==='light'){
    h.removeAttribute('data-theme');
    localStorage.setItem('theme','dark');
    document.getElementById('themeToggle').textContent='🌙 深色';
  } else {
    h.setAttribute('data-theme','light');
    localStorage.setItem('theme','light');
    document.getElementById('themeToggle').textContent='☀️ 浅色';
  }
}

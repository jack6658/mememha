<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(56,189,248,.3);color:#fff}

.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;transition:.15s;font-family:inherit;white-space:nowrap;user-select:none}

.card .b p:last-child{margin-bottom:0}

.card .b li::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;border-radius:2px;background:var(--muted)}
.card .b.core{background:var(--panel)}
.card .b.core h4{color:var(--accent)}
.card .b.core li::before{background:var(--accent)}
.card .b.kao{background:rgba(251,191,36,.05)}
.card .b.kao h4{color:var(--gold)}
.card .b.kao li::before{background:var(--gold)}
.card .b.nan{background:rgba(244,114,182,.05)}
.card .b.nan h4{color:var(--pink)}
.card .b.nan li::before{background:var(--pink)}
.card .b.trap{background:rgba(248,113,113,.05)}
.card .b.trap h4{color:var(--red)}
.card .b.trap li::before{background:var(--red)}
.card .b.exam{background:rgba(129,140,248,.05)}
.card .b.exam h4{color:var(--accent2)}
.card .b.exam li::before{background:var(--accent2)}
.card .b.table{background:var(--panel)}
.card .b.table h4{color:var(--green)}
.card .b .hl{color:var(--gold);font-weight:700}
.card .b .g{color:var(--green);font-weight:700}
.card .b .r{color:var(--red);font-weight:700}
.card .b .p{color:var(--pink);font-weight:700}
.card .b .o{color:var(--orange);font-weight:700}
.card .b code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:12.5px;color:var(--accent);font-family:"JetBrains Mono","Consolas",monospace}
.card .b strong{color:var(--ink)}
.card .b em{color:var(--accent2);font-style:normal}
.tbl-wrap{overflow-x:auto;margin:8px 0 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}

.tbl-wrap th,.tbl-wrap td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}

#study-empty{text-align:center;padding:50px 20px;color:var(--muted);max-width:480px;margin:auto}
#study-empty .big{font-size:64px;line-height:1;margin-bottom:12px}
#study-empty h2{font-size:20px;margin-bottom:5px;color:var(--ink)}
#study-empty p{font-size:14px;margin:5px auto}
#study-empty .btn{margin-top:14px}
#mob-toc-btn{display:none;position:fixed;bottom:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:100;background:var(--accent);color:var(--fill-text);border:none;border-radius:60px;padding:12px 18px;font-size:13px;font-weight:800;box-shadow:0 4px 20px rgba(56,189,248,.35);cursor:pointer;transition:.2s;font-family:inherit;line-height:1}
#mob-toc-btn:hover{transform:scale(1.05)}
#mob-toc{display:none;position:fixed;bottom:0;left:0;right:0;z-index:150;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px 16px;padding-bottom:calc(16px + var(--safe-b));max-height:60dvh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.5);animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#mob-toc.active{display:block}
#mob-toc .tt{font-size:10.5px;color:var(--muted);margin:8px 4px 4px;text-transform:uppercase;font-weight:700;letter-spacing:.4px}
#mob-toc a{display:block;color:var(--muted);text-decoration:none;font-size:13px;padding:7px 10px;border-radius:8px;transition:.15s}
#mob-toc a:hover{color:var(--accent);background:rgba(56,189,248,.08)}
#mob-toc a .no{display:inline-block;width:24px;color:var(--accent2);font-weight:700;font-size:11px}
#mob-toc .close{display:flex;justify-content:flex-end;margin-bottom:4px}
#mob-toc .close .btn{font-size:12px;padding:6px 12px;background:transparent;border-color:var(--muted);color:var(--muted)}
#mob-overlay{display:none;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}
#mob-overlay.active{display:block}
@media(max-width:820px){
  .wrap{flex-direction:column;padding:14px 14px 70px;padding-bottom:calc(70px + var(--safe-b))}
  nav.toc{display:none}
  #mob-toc-btn{display:flex}
  header.hero h1{font-size:16px}
  header.hero h1 .sub{font-size:11px}
  .hero-row{flex-direction:column;align-items:stretch}
  .ctrls{justify-content:flex-start}
  .card > summary .cg{max-width:100px;font-size:10px}
  .card .b{font-size:13px;padding:12px 14px}
  .tbl-wrap table{font-size:11.5px;min-width:300px}
  .tbl-wrap th,.tbl-wrap td{padding:6px 8px}
  #study-foot .btn{min-width:70px;font-size:12px;padding:8px 12px}
  #study-head{padding:8px 12px;padding-top:calc(8px + var(--safe-t));gap:6px}
  #study-head .h-title{font-size:11px}
  #study-stage{padding:14px 10px 10px}
}
@media(max-width:420px){
  .card .b{font-size:12px;padding:10px 12px}

  .tbl-wrap table{font-size:11px;min-width:260px}
  .tbl-wrap th,.tbl-wrap td{padding:5px 6px}
  #study-head .h-title{font-size:10.5px}
}
</style>

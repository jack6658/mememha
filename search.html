function doSearch(){
  var v=document.getElementById('q').value.trim();
  var cards=window.CARDS||[];
  var res=document.getElementById('res'),none=document.getElementById('none'),hint=document.getElementById('hint');
  if(!v){res.innerHTML='';none.style.display='none';hint.textContent='请输入卡片 ID（纯数字）搜索';return;}
  if(!/^\d+$/.test(v)){res.innerHTML='';none.style.display='block';none.textContent='请输入纯数字 ID（如 1、2、3…）';hint.textContent='无效输入：请只输入数字 ID';return;}
  var id=parseInt(v,10);
  var hits=cards.filter(function(x){return x.id===id;});
  if(!hits.length){res.innerHTML='';none.style.display='block';none.textContent='没有找到 ID 为 '+id+' 的卡片，请确认 ID 是否正确（只输入完整 ID 才能搜到）';hint.textContent='没有 ID 为 '+id+' 的卡片';return;}
  none.style.display='none';
  hint.textContent='✅ 找到 1 张卡片（ID '+id+'）';
  var html='';
  hits.forEach(function(x){
    var tags=(x.badges||[]).concat(x.tags||[]);
    var tagHtml=tags.slice(0,5).map(function(t){return '<span>'+t+'</span>';}).join('');
    html+='<a class="r" href="cards/'+encodeURIComponent(x.file)+'"><h3>'+(x.h1||x.title)+'</h3><div class="sub">'+x.title+'</div><div class="meta">'+tagHtml+'</div></a>';
  });
  res.innerHTML=html;
}

var pendingTimer=null;
function scheduleSearch(){
  if(pendingTimer)clearTimeout(pendingTimer);
  var hint=document.getElementById('hint');
  if(hint)hint.textContent='⏳ 正在扫描…';
  pendingTimer=setTimeout(function(){pendingTimer=null;doSearch();},1500);
}
document.getElementById('q').addEventListener('input',scheduleSearch);
doSearch();
</script>
<script>
/* ===== 背景星空 ===== */
(function(){
  var box=document.getElementById('stars');
  if(!box)return;
  var n=('ontouchstart' in window)||innerWidth<768?45:70,html='';
  for(var i=0;i<n;i++){
    var x=Math.random()*100,y=Math.random()*100,s=0.6+Math.random()*1.6,d=Math.random()*4;
    html+='<i style="position:absolute;left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;border-radius:50%;background:#cfe8ff;opacity:'+(0.3+Math.random()*0.6)+';animation:tw'+(d|0)+' '+(2+Math.random()*3)+'s infinite"></i>';
  }
  box.innerHTML=html;
  var css='';
  for(var k=0;k<5;k++){css+='@keyframes tw'+k+'{0%,100%{opacity:.2}50%{opacity:1}}';}
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
})();
/* ===== 鼠标霓虹粒子（轻量版：极小粒子 + 移动端自动降级） ===== */
(function(){
  var cv=document.getElementById('fx');
  if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d');
  var W,H,pts=[],mX=-999,mY=-999;
  var light=('ontouchstart' in window)||innerWidth<768; /* 移动端/小屏：更轻量 */
  var cap=light?36:70;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();addEventListener('resize',resize);
  var colors=['#7dd3fc','#c084fc','#6ee7b7','#ffd76a'];
  document.addEventListener('mousemove',function(e){mX=e.clientX;mY=e.clientY;});
  document.addEventListener('touchmove',function(e){if(e.touches[0]){mX=e.touches[0].clientX;mY=e.touches[0].clientY;}},{passive:true});
  setInterval(function(){
    if(mX<0)return;
    var n=light?1:2;
    for(var i=0;i<n;i++){
      pts.push({x:mX+(Math.random()-0.5)*14,y:mY+(Math.random()-0.5)*14,
        vx:(Math.random()-0.5)*0.7,vy:(Math.random()-0.5)*0.7-0.25,
        l:1,d:0.022+Math.random()*0.03,c:colors[(Math.random()*colors.length)|0],r:0.5+Math.random()*1.0});
    }
    if(pts.length>cap)pts.splice(0,pts.length-cap);
  },light?70:40);
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=pts.length-1;i>=0;i--){
      var p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.012;p.vx*=0.97;p.l-=p.d;
      if(p.l<=0){pts.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,p.l)*0.8;
      ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l+0.4,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

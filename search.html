function doSearch(){
  if(!_lbUser){alert('请先登录账号，登录后才能搜索知识卡');openUserPanel();return;}
  var v=document.getElementById('q').value.trim();
  var cards=window.CARDS||[];
  var res=document.getElementById('res'),none=document.getElementById('none'),hint=document.getElementById('hint');
  if(!v){res.innerHTML='';none.style.display='none';hint.textContent='请输入卡片 ID（纯数字）搜索';return;}
  if(!/^\d+$/.test(v)){res.innerHTML='';none.style.display='block';none.textContent='请输入纯数字 ID（如 1、2、3…）';hint.textContent='无效输入：请只输入数字 ID';return;}
  var id=parseInt(v,10);
  var hits=cards.filter(function(x){return x.id===id;});
  if(!hits.length){res.innerHTML='';none.style.display='block';none.textContent='没有找到 ID 为 '+id+' 的卡片，请确认 ID 是否正确（只输入完整 ID 才能搜到）';hint.textContent='没有 ID 为 '+id+' 的卡片';return;}
  none.style.display='none';
  hint.textContent='✅ 找到 1 张卡片（ID '+id+'）';
  var html='';
  hits.forEach(function(x){
    var tags=(x.badges||[]).concat(x.tags||[]);
    var tagHtml=tags.slice(0,5).map(function(t){return '<span>'+t+'</span>';}).join('');
    html+='<a class="r" href="cards/'+encodeURIComponent(x.file)+'"><h3>'+(x.h1||x.title)+'</h3><div class="sub">'+x.title+'</div><div class="meta">'+tagHtml+'</div></a>';
  });
  res.innerHTML=html;
}

function getSiteAchData(){try{var r=localStorage.getItem('site_ach');return r?JSON.parse(r):{};}catch(e){return {};}}
function calcSiteAch(){
  var data=getSiteAchData();
  var completed=0,totalPages=0,correct=0,perfectCount=0,anyPerfect=0,maxStreak=0,maxWrong=0;
  for(var k in data){var d=data[k];if(d.completed)completed++;totalPages+=(d.pages||0);correct+=(d.correct||0);if(d.perfect){anyPerfect=1;perfectCount++;}if((d.maxStreak||0)>maxStreak)maxStreak=d.maxStreak;if((d.maxWrong||0)>maxWrong)maxWrong=d.maxWrong;}
  stTitles=[];
  if(totalPages>=1)stTitles.push('t1');
  if(totalPages>=20)stTitles.push('t2');
  if(totalPages>=50)stTitles.push('t3');
  if(totalPages>=120)stTitles.push('t4');
  stMedals=[];
  if(maxStreak>=7)stMedals.push('m1');
  if(maxWrong>=8)stMedals.push('m2');
  if(correct>=70)stMedals.push('m3');
  if(correct>=100)stMedals.push('m4');
  if(correct>=150)stMedals.push('m5');
  if(completed>=10)stMedals.push('m6');
  if(completed>=30)stMedals.push('m7');
  if(anyPerfect)stMedals.push('m8');
  if(perfectCount>=3)stMedals.push('m9');
  if(maxStreak>=20)stMedals.push('m10');
  if(correct>=200)stMedals.push('m11');
  if(completed>=10)stMedals.push('m12');
}
function openSiteAch(){
  calcSiteAch();

  if(!wall)return;
  var ti=stTInfo.map(function(x){var on=stTitles.indexOf(x[0])>=0;return '<div class="ag-i lv'+x[3]+' '+(on?'':'locked')+'"><strong>'+(on?'🏆 ':'🔒 ')+'<span class="'+(on?'':'mask')+'">'+x[1]+'</span></strong><small><span class="'+(on?'':'mask')+'">'+(on?x[2]:'解锁条件保密')+'</span></small><em>'+stLevelLabel[x[3]]+'</em></div>';}).join('');
  var mi=stMInfo.map(function(m){var on=stMedals.indexOf(m[0])>=0;return '<div class="am-i lv'+m[4]+' '+(on?'':'locked')+'"><span class="mi">'+(on?m[1]:'🔒')+'</span><b><span class="'+(on?'':'mask')+'">'+m[2]+'</span></b><small><span class="'+(on?'':'mask')+'">'+(on?m[3]:'解锁条件保密')+'</span></small><em>'+stLevelLabel[m[4]]+'</em></div>';}).join('');
  document.getElementById('stTitleList').innerHTML=ti;
  document.getElementById('stMedalGrid').innerHTML=mi;
  document.getElementById('stTitleProg').textContent=stTitles.length+' / 4';
  document.getElementById('stMedalProg').textContent=stMedals.length+' / '+stMInfo.length;
  var newT=stTitles.filter(function(t){return !lastTitles||lastTitles.indexOf(t)<0;});
  var newM=stMedals.filter(function(m){return !lastMedals||lastMedals.indexOf(m)<0;});
  if(lastTitles){for(var i=0;i<newT.length;i++){(function(idx){var info=stTInfo.find(function(x){return x[0]===newT[idx];});if(info)setTimeout(function(){showAchievementEffect(info[3],info[1],'🏆');},idx*400);})(i);}}
  if(lastMedals){for(var j=0;j<newM.length;j++){(function(idx){var info=stMInfo.find(function(x){return x[0]===newM[idx];});if(info)setTimeout(function(){showAchievementEffect(info[4],info[2],info[1]);},idx*250);})(j);}}
  lastTitles=stTitles.slice();
  lastMedals=stMedals.slice();
  wall.classList.add('show');
}
function closeSiteAch(){var w=document.getElementById('siteAchWall');if(w)w.classList.remove('show');}
function checkAndTriggerAchievement(){
  calcSiteAch();
  var newT=stTitles.filter(function(t){return !lastTitles||lastTitles.indexOf(t)<0;});
  var newM=stMedals.filter(function(m){return !lastMedals||lastMedals.indexOf(m)<0;});
  if(newT.length>0||newM.length>0){
    for(var i=0;i<newT.length;i++){(function(idx){var info=stTInfo.find(function(x){return x[0]===newT[idx];});if(info)setTimeout(function(){showAchievementEffect(info[3],info[1],'🏆');},idx*400);})(i);}
    for(var j=0;j<newM.length;j++){(function(idx){var info=stMInfo.find(function(x){return x[0]===newM[idx];});if(info)setTimeout(function(){showAchievementEffect(info[4],info[2],info[1]);},idx*250);})(j);}
  }
  lastTitles=stTitles.slice();
  lastMedals=stMedals.slice();
}
function showAchievementEffect(lvl,name,icon){
  var color=['','#e8edff','#7dd3fc','#c084fc','#f87171','#ffd76a'][lvl]||'#fff';
  var flash=document.createElement('div');flash.className='ach-flash';document.body.appendChild(flash);
  requestAnimationFrame(function(){flash.style.opacity=lvl>=4?'0.5':'0.3';setTimeout(function(){flash.style.opacity='0';setTimeout(function(){flash.remove();},300);},200);});
  var modal=document.createElement('div');modal.className='ach-modal';modal.style.border='3px solid '+color;modal.style.boxShadow='0 0 '+(lvl>=4?80:40)+'px '+color+'88';
  if(lvl===5)modal.style.background='linear-gradient(135deg,rgba(255,215,106,0.2),rgba(192,132,252,0.2),rgba(125,211,252,0.2))';
  modal.innerHTML='<div style="font-size:'+(lvl>=4?'100px':'70px')+';margin-bottom:15px">'+icon+'</div><h2 style="color:'+color+';font-size:'+(lvl>=4?'36px':'28px')+';margin-bottom:8px">'+name+'</h2><p>'+(lvl>=4?'🏆 称号已解锁！':'🎖️ 勋章已解锁！')+'</p>';
  document.body.appendChild(modal);
  requestAnimationFrame(function(){modal.classList.add('show');});
  for(var i=0;i<lvl*25;i++){setTimeout(function(){createParticle(color,lvl);},i*25);}
  if(lvl>=4)for(var j=0;j<50;j++){setTimeout(function(){createConfetti(color);},j*40);}
  setTimeout(function(){modal.classList.remove('show');setTimeout(function(){modal.remove();},500);},lvl>=4?4000:3000);
}
function createParticle(color,lvl){
  var p=document.createElement('div');p.className='ach-particle';p.style.background=color;p.style.width=p.style.height=(lvl>=4?'14':'10')+'px';
  p.style.left='50%';p.style.top='50%';document.body.appendChild(p);
  var ang=Math.random()*Math.PI*2;var vel=(80+Math.random()*120)*(lvl>=4?1.5:1);
  var vx=Math.cos(ang)*vel;var vy=Math.sin(ang)*vel;var x=0,y=0,op=1;
  (function anim(){x+=vx*0.02;y+=vy*0.02+2;op-=0.015;p.style.transform='translate('+x+'px,'+y+'px)';p.style.opacity=op;if(op>0)requestAnimationFrame(anim);else p.remove();})();
}
function createConfetti(color){
  var c=document.createElement('div');c.className='ach-confetti';c.style.background=color;c.style.left=Math.random()*100+'vw';c.style.top='-20px';
  document.body.appendChild(c);
  var dur=3000+Math.random()*1000;var start=Date.now();
  (function anim(){var el=Date.now()-start;if(el>=dur){c.remove();return;}c.style.top=(el/dur*120)+'vh';c.style.transform='rotate('+(el/dur*720)+'deg)';c.style.opacity=1-el/dur;requestAnimationFrame(anim);})();
}
var _lbSupabase=null,_lbUser=null,_lbUserData=null;
var _lbConfig={url:'https://llyzyvkydvcvlcnnvpox.supabase.co',key:'sb_publishable_5GqnvHgsRqQGasfcht5j6Q_taOzntOP'};
async function initLeaderboard(){
  if(!_lbConfig.url||!_lbConfig.key){
    document.getElementById('lbContent').innerHTML='<p style="color:#ffd76a;text-align:center;padding:30px">⚠️ 排行榜功能未配置<br><small>请在 search.html 中找到 <code style="background:rgba(255,255,255,.1);padding:2px 6px;border-radius:4px">_lbConfig</code> 并填入你的 Supabase URL 和 Key</small></p>';
    return;
  }
  try{
    _lbSupabase=supabase.createClient(_lbConfig.url,_lbConfig.key);
    // 只读取本地已注册的 uid（不自动生成匿名 uid）
    _lbUser=localStorage.getItem('lb_uid')||null;
    await refreshLeaderboard(); // 仅读取显示，未注册用户不写入
  }catch(e){
    document.getElementById('lbContent').innerHTML='<p style="color:#f87171;text-align:center">连接失败: '+e.message+'</p>';
  }
}
async function refreshLeaderboard(){
  if(!_lbSupabase)return;
  // 仅注册用户才同步写入；未注册只读
  if(_lbUser&&_lbUserData){await syncCurrentUser();}
  var r=await _lbSupabase.from('leaderboard').select('*').order('total_score',{ascending:false}).limit(50);
  renderLeaderboard(r.data||[]);
  document.getElementById('lbLastUpdate').textContent='更新: '+new Date().toLocaleTimeString('zh-CN');
}
async function syncCurrentUser(){
  if(!_lbSupabase)return;
  var d=getCurrentData();
  try{
    await _lbSupabase.from('leaderboard').upsert({
      user_id:_lbUser,
      user_name:(_lbUserData&&_lbUserData.user_name)?_lbUserData.user_name:'用户_'+_lbUser.slice(-4),
      avatar:(_lbUserData&&_lbUserData.avatar)?_lbUserData.avatar:'😀',
      total_pages:d.totalPages,total_correct:d.correct,
      completed_sets:d.completed,max_streak:d.maxStreak,
      total_score:calcScore(d),last_seen:new Date().toISOString()
    },{onConflict:'user_id'});
  }catch(e){console.log('同步失败:',e.message);}
}
function getCurrentData(){
  try{
    var data=JSON.parse(localStorage.getItem('site_ach')||'{}');
    var c=0,tp=0,cr=0,ms=0;
    for(var k in data){var v=data[k];if(v.completed)c++;tp+=(v.pages||0);cr+=(v.correct||0);if((v.maxStreak||0)>ms)ms=v.maxStreak;}
    return{totalPages:tp,correct:cr,completed:c,maxStreak:ms};
  }catch(e){return{totalPages:0,correct:0,completed:0,maxStreak:0};}
}
function calcScore(d){return d.totalPages*2+d.correct*1+d.completed*10+d.maxStreak*5;}
function renderLeaderboard(list){
  var el=document.getElementById('lbContent');
  if(!list.length){el.innerHTML='<div class="lb-empty">暂无记录，快来刷分吧！</div>';return;}
  var html='<div class="lb-tabs">';
  html+='<button class="lb-tab active" onclick="switchLbTab(\"score\",this)">🏆 总分</button>';
  html+='<button class="lb-tab" onclick="switchLbTab(\"pages\",this)">📖 浏览</button>';
  html+='<button class="lb-tab" onclick="switchLbTab(\"correct\",this)">✅ 答题</button>';
  html+='</div>';
  list.forEach(function(item,i){
    var rank=i+1;
    var rc=rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    var isMe=item.user_id===_lbUser;
    var bgStyle=isMe?' style="border-color:#ffd76a;background:rgba(255,215,106,.1)"':'';
    var avInfo=parseAvatar(item.avatar||'😀|#ffd76a');
    var avHtml='<div class="lb-avatar" style="border-color:'+avInfo.color+';background:'+avInfo.color+'22">'+avInfo.icon+'</div>';
    var nameTag=(item.user_name||'匿名用户')+(isMe?' (你)':'');
    html+='<div class="lb-item'+bgStyle+'">'+avHtml+'<div class="lb-rank '+rc+'">'+rank+'</div><div class="lb-name">'+nameTag+'</div><div class="lb-stats">📖'+item.total_pages+'页 <span>✅'+item.total_correct+'答</span> <span>🎯'+item.completed_sets+'套</span></div></div>';
  });
  el.innerHTML=html;
}
function switchLbTab(type,btn){
  document.querySelectorAll('.lb-tab').forEach(function(b){b.classList.remove('active');});
  if(btn)btn.classList.add('active');
  if(!_lbSupabase)return;
  var col=type==='score'?'total_score':type==='pages'?'total_pages':'total_correct';
  _lbSupabase.from('leaderboard').select('*').order(col,{ascending:false}).limit(50).then(function(r){renderLeaderboard(r.data||[]);});
}

  document.getElementById('leaderboardWall').classList.add('show');

function registerUser(){
  var name=document.getElementById('regNameInput').value.trim();
  if(!name){alert('请输入昵称');return;}
  if(!_lbConfig.url||!_lbConfig.key){alert('⚠️ 请先在 search.html 里填入 Supabase 配置(_lbConfig)，排行榜才能生效！');return;}
  if(!_lbSupabase){
    try{_lbSupabase=supabase.createClient(_lbConfig.url,_lbConfig.key);}catch(e){alert('连接失败: '+e.message);return;}
  }
  var el=document.getElementById('userInfo');
  el.innerHTML='<p style="color:#aeb9d4;text-align:center">⏳ 注册中...</p>';
  // 先查重：同名的已注册用户
  _lbSupabase.from('users').select('user_id,user_name').eq('user_name',name)
  .then(function(r){
    if(r.data&&r.data.length>0){
      el.innerHTML=renderRegForm();
      alert('❌ 昵称「'+name+'」已被注册，请换一个！');
      return;
    }
    // 无重名 → 注册
    var uid='u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);
    localStorage.setItem('lb_uid',uid);
    _lbUser=uid;
    var avatar=_regAv+'|'+_regColor;
    _lbUserData={user_id:uid,user_name:name,avatar:avatar};
    return _lbSupabase.from('users').upsert({user_id:uid,user_name:name,avatar:avatar},{onConflict:'user_id'});
  })
  .then(function(){
    if(!_lbUser)return; // 重名时已 return，没有 _lbUser
    return syncCurrentUser(); // 注册即同步排行榜
  })
  .then(function(){
    if(!_lbUser)return;
    alert('注册成功！用户名「'+name+'」已上排行榜');
    loadUserProfile();
  })
  .catch(function(e){alert('注册失败: '+e.message);el.innerHTML=renderRegForm();});
}

function loadUserProfileData(){
  return new Promise(function(resolve){
    if(!_lbUser||!_lbSupabase){resolve();return;}
    _lbSupabase.from('users').select('*').eq('user_id',_lbUser).single()
    .then(function(r){
      if(r.data){_lbUserData=r.data;}
      resolve();
    })
    .catch(function(){resolve();});
  });
}

function loadUserProfile(){
  var el=document.getElementById('userInfo');
  if(!_lbUser){
    // 注册表单：用户名 + 头像选择 一步完成
    el.innerHTML=renderRegForm();
    setTimeout(function(){var inp=document.getElementById('regNameInput');if(inp)inp.focus();},100);
    return;
  }
  el.innerHTML='<p style="color:#aeb9d4;text-align:center">加载中...</p>';
  if(!_lbSupabase){el.innerHTML='<p style="color:#f87171;text-align:center">未连接数据库</p>';return;}
  _lbSupabase.from('users').select('*').eq('user_id',_lbUser).single()
  .then(function(r){
    if(r.data){
      _lbUserData=r.data;
      renderUserProfile();
    }else{
      // 数据库没有该用户记录 → 说明是残留的本地 uid，回到注册界面
      localStorage.removeItem('lb_uid');
      _lbUser=null;
      el.innerHTML=renderRegForm();
    }
  })
  .catch(function(e){el.innerHTML='<p style="color:#f87171">加载失败: '+e.message+'</p>';});
}

  html+='<div style="width:90px;height:90px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:46px;border:3px solid '+av.color+';background:'+av.color+'22;box-shadow:0 0 20px '+av.color+'44">'+av.icon+'</div>';
  // 用户名（注册名）

  var d=getCurrentData();
  html+='<div style="background:rgba(255,255,255,.05);border:1px solid #354467;border-radius:12px;padding:14px;margin-bottom:16px;text-align:left">';

  html+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:#aeb9d4">完成卡套</span><span style="color:#c084fc;font-weight:bold">'+d.completed+' 套</span></div>';
  html+='<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:#aeb9d4">连续答对</span><span style="color:#f87171;font-weight:bold">'+d.maxStreak+' 题</span></div>';
  html+='</div>';
  // 切换账号
  html+='<button class="logout-btn" onclick="logoutUser()" style="background:rgba(255,255,255,.08);border:1px solid #526487;border-radius:10px;padding:10px 24px;font-size:13px;color:#e8edff;cursor:pointer;width:100%">🔄 切换账号</button>';

}var _avColor='#ffd76a';
function parseAvatar(a){
  if(a&&a.indexOf('|')>0){var p=a.split('|');return{icon:p[0],color:p[1]||'#ffd76a'};}
  return{icon:a||'😀',color:'#ffd76a'};
}
async function logoutUser(){
  if(confirm('确定要切换账号吗？')){
    localStorage.removeItem('lb_uid');
    _lbUser=null;
    _lbSupabase=null;
    closeUserPanel();
    location.reload();
  }
}
(function(){var box=document.getElementById('stars');if(!box)return;var n=('ontouchstart' in window)||innerWidth<768?45:70,html='';for(var i=0;i<n;i++){var s=Math.random()*2+1;html+='<div style="position:absolute;width:'+s+'px;height:'+s+'px;background:white;border-radius:50%;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;opacity:'+(Math.random()*0.5+0.2)+';animation:twinkle '+(2+Math.random()*3)+'s ease-in-out infinite alternate"></div>';}box.innerHTML=html;})();

<script>
var canvas=document.getElementById('fx');if(!canvas)return;var ctx=canvas.getContext('2d');var W=canvas.width=innerWidth;var H=canvas.height=innerHeight;var pts=[];for(var i=0;i<60;i++){pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,r:Math.random()*1.5+0.5});}
function tick(){ctx.clearRect(0,0,W,H);pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(125,211,252,0.4)';ctx.fill();});requestAnimationFrame(tick);}
tick();
window.addEventListener('resize',function(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;});
</script>
<script><!-- AUTH_V2_OVERRIDES -->
(function(){
  var AUTH_DOMAIN='example.com';
  function authClient(){if(!_lbSupabase&&window.supabase&&_lbConfig.url&&_lbConfig.key)_lbSupabase=window.supabase.createClient(_lbConfig.url,_lbConfig.key);return _lbSupabase;}
  function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function normalizeName(n){return String(n||'').trim().toLowerCase();}
  function syntheticEmail(n){return 'u_'+encodeURIComponent(normalizeName(n)).replace(/%/g,'_')+'@example.com';}
  function authForm(){return '<div style="max-width:380px;margin:0 auto;text-align:center"><div style="font-size:38px">🔐</div><h3 style="color:#ffd76a;margin:8px 0">账号登录</h3><p style="color:#aeb9d4;font-size:12px;margin-bottom:14px">登录后才能搜索、阅读卡片和同步存档</p><input class="name-input" id="authName" placeholder="用户名" maxlength="20"><input class="name-input" id="authPass" type="password" placeholder="密码（至少6位）" minlength="6"><button class="save-btn" onclick="authSubmit(false)">登录</button><button class="logout-btn" onclick="authSubmit(true)">注册新账号</button></div>';}
  window.authSubmit=async function(reg){var n=(document.getElementById('authName').value||'').trim(),pw=document.getElementById('authPass').value||'',el=document.getElementById('userInfo');if(!n||!pw){alert('请输入用户名和密码');return;}if(pw.length<6){alert('密码至少需要6位');return;}var sb=authClient();if(!sb){alert('数据库连接未初始化');return;}el.innerHTML='<p style="text-align:center;color:#aeb9d4">处理中...</p>';try{if(reg){var exists=await sb.from('users').select('user_id').ilike('user_name',n).limit(1);if(exists.error)throw exists.error;if(exists.data&&exists.data.length){throw new Error('用户名已被注册');}var a=await sb.auth.signUp({email:syntheticEmail(n),password:pw});if(a.error)throw a.error;if(!a.data.user)throw new Error('注册未完成，请检查 Supabase Auth 设置');var uid=a.data.user.id;var u=await sb.from('users').upsert({user_id:uid,user_name:n,avatar:'😀|#ffd76a'},{onConflict:'user_id'});if(u.error)throw u.error;_lbUser=uid;_lbUserData={user_id:uid,user_name:n,avatar:'😀|#ffd76a'};await syncCurrentUser();alert('注册成功，用户名就是「'+n+'」');renderUserProfile();}else{var a=await sb.auth.signInWithPassword({email:syntheticEmail(n),password:pw});if(a.error)throw a.error;var uid=a.data.user.id;_lbUser=uid;var u=await sb.from('users').select('*').eq('user_id',uid).maybeSingle();if(u.error)throw u.error;if(!u.data)throw new Error('账号资料不存在');_lbUserData=u.data;localStorage.setItem('lb_uid',uid);await restoreAllCloudSaves();alert('登录成功，云端存档已同步');renderUserProfile();}}catch(e){el.innerHTML=authForm();alert((reg?'注册失败：':'登录失败：')+(e.message||e));}};
  window.loadUserProfileData=async function(){var sb=authClient();if(!sb)return;var se=await sb.auth.getSession();var u=se.data&&se.data.session&&se.data.session.user;if(!u){_lbUser=null;_lbUserData=null;return;} _lbUser=u.id;localStorage.setItem('lb_uid',u.id);var r=await sb.from('users').select('*').eq('user_id',u.id).maybeSingle();if(r.data)_lbUserData=r.data;};
  window.loadUserProfile=async function(){var el=document.getElementById('userInfo');if(!el)return;await loadUserProfileData();if(!_lbUser){el.innerHTML=authForm();return;}renderUserProfile();};
  window.renderUserProfile=function(){var el=document.getElementById('userInfo'),d=_lbUserData||{},x=getCurrentData();el.innerHTML='<div style="text-align:center"><div style="font-size:64px">'+esc((d.avatar||'😀').split('|')[0])+'</div><h3 style="color:#ffd76a">'+esc(d.user_name)+'</h3><p style="color:#7dd3fc;font-size:12px">✅ 已登录 · 云端存档同步中</p><div style="text-align:left;background:rgba(255,255,255,.05);padding:14px;border-radius:12px;margin:14px 0;color:#aeb9d4;font-size:13px">📖 浏览 '+x.totalPages+' 页<br>✅ 答对 '+x.correct+' 题<br>🎯 完成 '+x.completed+' 套</div><button class="logout-btn" onclick="logoutUser()">退出登录</button></div>';};
  window.logoutUser=async function(){var sb=authClient();if(sb)await sb.auth.signOut({scope:'local'});localStorage.removeItem('lb_uid');Object.keys(localStorage).forEach(function(k){if(k!=='theme'&&k.indexOf('sb-')!==0&&k.indexOf('supabase')!==0)localStorage.removeItem(k);});_lbUser=null;_lbUserData=null;location.href='../search.html';};
  window.initLeaderboard=async function(){var sb=authClient();if(!sb)return;var q=await sb.auth.getSession();var u=q.data&&q.data.session&&q.data.session.user;_lbUser=u?u.id:null;if(u){var pr=await sb.from('users').select('*').eq('user_id',u.id).maybeSingle();if(pr.data)_lbUserData=pr.data;await syncCurrentUser();}await refreshLeaderboard();};
  window.refreshLeaderboard=async function(){var sb=authClient();if(!sb)return;var r=await sb.from('leaderboard').select('*').order('total_score',{ascending:false}).limit(50);if(r.error){document.getElementById('lbContent').innerHTML='<p style="color:#f87171">排行榜读取失败：'+esc(r.error.message)+'</p>';return;}renderLeaderboard(r.data||[]);};
  if(window.supabase&&_lbConfig.url){_lbSupabase=window.supabase.createClient(_lbConfig.url,_lbConfig.key);_lbSupabase.auth.onAuthStateChange(function(e){if(e==='SIGNED_OUT'){_lbUser=null;_lbUserData=null;}});}
})();
</script>
<script>
/* AUTH_AUTO_INIT_V2: restore Supabase Auth session before search is usable */
(function(){
  async function start(){try{if(window._lbSupabase&&window._lbSupabase.auth){await window.loadUserProfileData();}else if(window.supabase&&window._lbConfig){window._lbSupabase=window.supabase.createClient(window._lbConfig.url,window._lbConfig.key);await window.loadUserProfileData();}if(new URLSearchParams(location.search).get('login')==='1')window.openUserPanel();}catch(e){console.warn('auth session init failed',e);}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>

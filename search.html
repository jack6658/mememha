.head{background:linear-gradient(135deg,#1f6f8b,#4fb3bf);color:#fff;padding:30px 20px;text-align:center}
.head h1{font-size:22px;margin-bottom:14px}
.box{max-width:640px;margin:0 auto;display:flex;gap:8px}

.r .meta span{font-size:10px;padding:1px 7px;border-radius:999px;background:#eef5f7;color:#4a6b7a}

<body>
<div class="head">

</div>
<script>

function doSearch(){
  var kw=document.getElementById('q').value.trim().toLowerCase();
  var cards=window.CARDS||[];
  var res=document.getElementById('res'),none=document.getElementById('none'),hint=document.getElementById('hint');
  if(!kw){res.innerHTML='';none.style.display='none';hint.textContent='输入关键词开始搜索，共 '+cards.length+' 张卡片';return;}
  var hits=cards.filter(function(x){
    var blob=[x.title,x.h1,(x.badges||[]).join(' '),(x.tags||[]).join(' ')].join(' ').toLowerCase();
    return kw.split(/\s+/).every(function(w){return w&&blob.indexOf(w)>=0;});
  });
  hint.textContent='找到 '+hits.length+' 张匹配卡片';
  if(!hits.length){res.innerHTML='';none.style.display='block';return;}
  none.style.display='none';
  var html='';
  hits.forEach(function(x){
    var tags=(x.badges||[]).concat(x.tags||[]);
    var tagHtml=tags.slice(0,5).map(function(t){return '<span>'+t+'</span>';}).join('');
    html+='<a class="r" href="cards/'+encodeURIComponent(x.file)+'"><h3>'+(x.h1||x.title)+'</h3><div class="sub">'+x.title+'</div><div class="meta">'+tagHtml+'</div></a>';
  });
  res.innerHTML=html;
}
document.getElementById('q').addEventListener('input',doSearch);
doSearch();
</script>

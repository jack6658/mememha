<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>山水之间 · 生物知识卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"KaiTi","STKaiti","楷体","Microsoft YaHei",serif;min-height:100dvh;overflow:hidden;color:#3d3845;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;background:#f4ecda}
/* ===== 国风水墨长卷 · 共享背景 ===== */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 18%, rgba(255,250,238,.98), rgba(244,236,214,.96) 46%, rgba(228,218,190,.94));
  filter:url(#paper-noise);opacity:.97}
.ink-scroll{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;overflow:hidden}
.ink-scroll svg{position:absolute;left:0;top:0;width:100%;height:100%}
.ink-vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(90% 70% at 50% 42%, transparent 55%, rgba(120,100,70,.16) 100%)}
.ink-frame{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 10px rgba(120,100,70,.06),inset 0 0 80px rgba(120,100,70,.14)}
.ink-nav{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.ink-nav .dot{width:7px;height:7px;border-radius:50%;background:#c0392b;opacity:.55;box-shadow:0 0 6px rgba(192,57,43,.5)}
.ink-nav .marker{width:32px;height:32px;border-radius:50%;border:2px solid #c0392b;color:#c0392b;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;background:rgba(255,250,238,.7);box-shadow:0 0 14px rgba(192,57,43,.45)}
.ink-seal{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#b8d4c4;font-family:"KaiTi","STKaiti","楷体",serif;font-size:13px;letter-spacing:1px;border:2px solid rgba(192,57,43,.85);color:#c0392b;background:rgba(255,250,238,.55);box-shadow:0 0 10px rgba(192,57,43,.3);pointer-events:none}
.walker{position:fixed;z-index:5;pointer-events:none;font-family:"KaiTi","STKaiti","楷体",serif;font-size:15px;color:#3d4350;opacity:.85;
  animation:ink-walk ease-in-out infinite alternate}
.walker.w1{left:-4%;bottom:12%;animation-duration:26s}
.walker.w2{right:-4%;bottom:10%;animation-duration:22s;animation-direction:alternate-reverse}
@keyframes ink-walk{from{transform:translateX(0) translateY(0)}to{transform:translateX(60px) translateY(-7px)}}
@media(max-width:560px){.ink-seal{width:46px;height:46px;font-size:11px}.ink-nav{gap:10px}}

.stage{position:relative;z-index:4;text-align:center;padding:24px;animation:inkFade 2s ease both}
@keyframes inkFade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.sub{font-size:clamp(13px,2vw,17px);letter-spacing:10px;color:#8b7f66;margin-bottom:16px;font-weight:500}
h1{font-size:clamp(46px,9vw,96px);font-weight:700;letter-spacing:18px;line-height:1.12;color:#3a3a35;text-shadow:0 2px 12px rgba(120,100,70,.18);margin-bottom:12px}
h1 small{display:block;font-size:clamp(12px,1.8vw,15px);letter-spacing:14px;color:#9a8f78;font-weight:400;margin-top:12px}
.ink-line{width:180px;height:2px;margin:22px auto;background:linear-gradient(90deg,transparent,#b0a489,transparent)}
.enter-btn{margin-top:34px;font-family:inherit;font-size:clamp(17px,2.6vw,21px);font-weight:700;letter-spacing:10px;color:#3d3845;background:transparent;border:2px solid #3d3a35;border-radius:999px;padding:14px 46px 14px 56px;cursor:pointer;transition:.3s;position:relative}
.enter-btn:hover{background:#3d3a35;color:#f4ecda;transform:translateY(-2px);box-shadow:0 8px 26px rgba(70,60,45,.25)}
.enter-btn:active{transform:scale(.96)}
.hint{margin-top:24px;font-size:12.5px;color:#a69c85;letter-spacing:4px}
.corner{position:fixed;left:18px;bottom:14px;z-index:6;font-size:12px;color:#a69c85;letter-spacing:2px}
.seal-mark{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:1px;color:#c0392b;border:2px solid rgba(192,57,43,.85);background:rgba(255,250,238,.6);box-shadow:0 0 12px rgba(192,57,43,.3);pointer-events:none}
@media(max-width:560px){h1{letter-spacing:8px}.enter-btn{padding:12px 30px 12px 40px}}

/* ===== 双端性能策略 ===== */
html[data-device="desktop"] .ink-scroll{animation:inkCanvasDrift 80s ease-in-out infinite alternate;will-change:transform}
@keyframes inkCanvasDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-.8%,0,0)}}
html[data-device="desktop"] .walker,html[data-device="desktop"] .ink-walker{will-change:transform}
html[data-device="desktop"] .seal-mark,html[data-device="desktop"] .ink-seal{animation:sealBreath 6s ease-in-out infinite}
@keyframes sealBreath{0%,100%{transform:translateX(-50%) scale(1);opacity:.86}50%{transform:translateX(-50%) scale(1.035);opacity:1}}
html[data-device="mobile"] .ink-scroll{animation:none!important}
html[data-device="mobile"] .walker,html[data-device="mobile"] .ink-walker,html[data-device="mobile"] .seal-mark,html[data-device="mobile"] .ink-seal{animation:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

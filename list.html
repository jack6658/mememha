*{box-sizing:border-box;margin:0;padding:0}

.hero{background:linear-gradient(135deg,#1f6f8b,#4fb3bf);color:#fff;padding:36px 20px 32px;text-align:center}

.bar{display:flex;justify-content:center;gap:10px;margin:-18px auto 26px;max-width:640px;padding:0 16px}
.bar a{flex:1;text-decoration:none;color:#1f6f8b;background:#fff;border:1px solid #d7e2e8;border-radius:10px;padding:11px 10px;font-size:13px;text-align:center;box-shadow:0 3px 10px rgba(31,111,139,.08);font-weight:700}

.card h3{font-size:14.5px;margin-bottom:6px;color:#1f6f8b;line-height:1.45}
.card .sub{font-size:11.5px;color:#7a8b99;margin-bottom:8px}
.card .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.card .meta span{font-size:10px;padding:1px 7px;border-radius:999px;background:#eef5f7;color:#4a6b7a}
.card .meta b{font-size:10px;color:#a3b3bf;font-weight:600;margin-left:auto;align-self:center}
.empty{text-align:center;color:#9aa8b5;padding:60px 0;font-size:14px}
footer{text-align:center;color:#a3b3bf;font-size:11px;padding:20px}
</style>
</head>

<script>
/* ===== 背景星空（静态闪烁小星星） ===== */
(function(){
  var box=document.getElementById('stars');
  if(!box)return;
  var n=90,html='';
  for(var i=0;i<n;i++){
    var x=Math.random()*100,y=Math.random()*100,s=0.6+Math.random()*1.6,d=Math.random()*4;
    html+='<i style="position:absolute;left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;border-radius:50%;background:#cfe8ff;opacity:'+(0.3+Math.random()*0.6)+';animation:tw'+(d|0)+' '+(2+Math.random()*3)+'s infinite"></i>';
  }
  box.innerHTML=html;
  var css='';
  for(var k=0;k<5;k++){css+='@keyframes tw'+k+'{0%,100%{opacity:.2}50%{opacity:1}}';}
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
})();
/* ===== 鼠标霓虹粒子 ===== */
(function(){
  var cv=document.getElementById('fx');
  if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d');
  var W,H,pts=[],mX=-999,mY=-999;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();addEventListener('resize',resize);
  var colors=['#7dd3fc','#c084fc','#6ee7b7','#ffd76a','#ff9a76'];
  document.addEventListener('mousemove',function(e){mX=e.clientX;mY=e.clientY;});
  document.addEventListener('touchmove',function(e){if(e.touches[0]){mX=e.touches[0].clientX;mY=e.touches[0].clientY;}});
  setInterval(function(){
    if(mX<0)return;
    for(var i=0;i<3;i++){
      pts.push({x:mX+(Math.random()-0.5)*26,y:mY+(Math.random()-0.5)*26,
        vx:(Math.random()-0.5)*1.4,vy:(Math.random()-0.5)*1.4-0.5,
        l:1,d:0.018+Math.random()*0.025,c:colors[(Math.random()*colors.length)|0],r:1.4+Math.random()*2.6});
    }
    if(pts.length>300)pts.splice(0,pts.length-300);
  },24);
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=pts.length-1;i>=0;i--){
      var p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.vx*=0.98;p.l-=p.d;
      if(p.l<=0){pts.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,p.l);
      ctx.shadowColor=p.c;ctx.shadowBlur=14;
      ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l+1,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

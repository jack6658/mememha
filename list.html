﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识卡 · 功能选择</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"KaiTi","STKaiti","楷体","Microsoft YaHei",serif;min-height:100vh;color:#3d3845;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;background:#f4ecda}
/* ===== 国风水墨长卷 · 共享背景 ===== */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 18%, rgba(255,250,238,.98), rgba(244,236,214,.96) 46%, rgba(228,218,190,.94));
  filter:url(#paper-noise);opacity:.97}
.ink-scroll{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;overflow:hidden}
.ink-scroll svg{position:absolute;left:0;top:0;width:100%;height:100%}
.ink-vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(90% 70% at 50% 42%, transparent 55%, rgba(120,100,70,.16) 100%)}
.ink-frame{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 10px rgba(120,100,70,.06),inset 0 0 80px rgba(120,100,70,.14)}
.ink-nav{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.ink-nav .dot{width:7px;height:7px;border-radius:50%;background:#c0392b;opacity:.55;box-shadow:0 0 6px rgba(192,57,43,.5)}
.ink-nav .marker{width:32px;height:32px;border-radius:50%;border:2px solid #c0392b;color:#c0392b;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;background:rgba(255,250,238,.7);box-shadow:0 0 14px rgba(192,57,43,.45)}
.ink-seal{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#b8d4c4;font-family:"KaiTi","STKaiti","楷体",serif;font-size:13px;letter-spacing:1px;border:2px solid rgba(192,57,43,.85);color:#c0392b;background:rgba(255,250,238,.55);box-shadow:0 0 10px rgba(192,57,43,.3);pointer-events:none}
.walker{position:fixed;z-index:5;pointer-events:none;font-family:"KaiTi","STKaiti","楷体",serif;font-size:15px;color:#3d4350;opacity:.85;
  animation:ink-walk ease-in-out infinite alternate}
.walker.w1{left:-4%;bottom:12%;animation-duration:26s}
.walker.w2{right:-4%;bottom:10%;animation-duration:22s;animation-direction:alternate-reverse}
@keyframes ink-walk{from{transform:translateX(0) translateY(0)}to{transform:translateX(60px) translateY(-7px)}}
@media(max-width:560px){.ink-seal{width:46px;height:46px;font-size:11px}.ink-nav{gap:10px}}

.stage{position:relative;z-index:4;text-align:center;padding:20px;animation:inkFade 1.6s ease both}
@keyframes inkFade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.sub{font-size:13px;letter-spacing:10px;color:#8b7f66;margin-bottom:14px}
h1{font-size:clamp(32px,6vw,50px);font-weight:700;letter-spacing:14px;color:#3a3a35;text-shadow:0 2px 10px rgba(120,100,70,.16);margin-bottom:8px}
.tip{font-size:12.5px;color:#a69c85;letter-spacing:3px;margin-bottom:32px}
.choices{display:flex;flex-direction:column;gap:18px;align-items:center}
.ch{display:flex;align-items:center;justify-content:center;gap:16px;text-decoration:none;width:min(380px,86vw);padding:20px 24px;border-radius:14px;border:1.5px solid #9a8f72;background:rgba(255,250,238,.62);color:#3d3845;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:4px;transition:.28s;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 5px 16px rgba(110,95,60,.12);backdrop-filter:blur(4px)}
.ch .big{font-size:26px;filter:grayscale(.4)}
.ch .desc{font-size:11.5px;color:#9a906f;font-weight:400;letter-spacing:1.5px;line-height:1.7;display:block;margin-top:3px}
.ch:hover{border-color:#3d3a35;transform:translateY(-3px);box-shadow:0 10px 28px rgba(80,70,45,.22)}
.ch.home:hover{border-color:#c0392b}
@media(max-width:560px){h1{letter-spacing:8px}}
.seal-mark{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:1px;color:#c0392b;border:2px solid rgba(192,57,43,.85);background:rgba(255,250,238,.6);box-shadow:0 0 12px rgba(192,57,43,.3);pointer-events:none}
</style>
</head>
<body>
<div class="ink-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f1e0"/><stop offset="1" stop-color="#efe6cf"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e2cb" stop-opacity=".9"/><stop offset="1" stop-color="#dcd3b8" stop-opacity=".95"/></linearGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb7a8"/><stop offset="1" stop-color="#a8c4ae"/></linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ba396"/><stop offset="1" stop-color="#94b3a0"/></linearGradient>
    <linearGradient id="mtn3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e7f74"/><stop offset="1" stop-color="#789a83"/></linearGradient>
  </defs>
  <!-- 天空 -->
  <rect width="1440" height="900" fill="url(#sky)"/>
  <!-- 远山层1（石青淡染） -->
  <path d="M0,420 C140,340 260,375 400,330 C540,288 640,340 780,318 C930,296 1010,352 1160,322 C1280,300 1380,340 1440,318 L1440,900 L0,900 Z" fill="url(#mtn1)" opacity=".5"/>

  <rect y="430" width="1440" height="60" fill="#f0e9d6" opacity=".35"/>
  <!-- 孤峰群（皴法勾勒） -->
  <g stroke="#42534d" stroke-width="2.4" fill="none" opacity=".8">
    <path d="M150,470 L188,368 L214,470 Z" fill="url(#mtn3)"/>

    <path d="M480,454 C486,428 500,398 508,380 M492,452 C500,424 510,402 516,388 M470,478 C482,444 494,414 502,396" opacity=".5"/>
    <path d="M940,470 L976,380 L1008,470 Z" fill="url(#mtn3)"/>
    <path d="M950,452 C956,430 966,404 972,392 M958,450 C964,426 972,404 978,392" opacity=".5"/>
    <path d="M1230,478 L1264,388 L1296,478 Z" fill="url(#mtn3)"/>
    <path d="M1238,456 C1244,434 1252,414 1258,398 M1246,455 C1252,432 1260,410 1266,396" opacity=".5"/>
  </g>
  <!-- 水面平如镜（含倒影） -->
  <rect y="486" width="1440" height="414" fill="url(#water)"/>
  <g transform="translate(0,972) scale(1,-1)" opacity=".16">
    <path d="M150,486 L188,368 L214,486 Z" fill="url(#mtn3)"/>
    <path d="M470,486 L512,356 L548,486 Z" fill="url(#mtn3)"/>
    <path d="M940,486 L976,380 L1008,486 Z" fill="url(#mtn3)"/>
    <path d="M1230,486 L1264,388 L1296,486 Z" fill="url(#mtn3)"/>
  </g>
  <line x1="0" y1="486" x2="1440" y2="486" stroke="#c9bfa2" stroke-width="1.4" opacity=".8"/>
  <!-- 岸边 -->
  <path d="M0,540 C220,520 380,556 560,542 C760,528 980,566 1200,548 C1300,540 1390,556 1440,548 L1440,900 L0,900 Z" fill="#dcd2b6" opacity=".6"/>
  <!-- 古松（右岸） -->
  <g stroke="#3f4a44" stroke-width="3" fill="none" opacity=".85">
    <path d="M1050,528 C1052,492 1046,458 1038,430"/>
    <path d="M1038,472 C1016,462 1000,456 984,452 M1038,452 C1020,440 1006,434 992,430 M1036,486 C1060,478 1076,470 1092,462 M1036,464 C1060,452 1078,442 1096,430"/>
    <circle cx="984" cy="450" r="2" fill="#3f4a44" opacity=".6"/><circle cx="992" cy="428" r="2" fill="#3f4a44" opacity=".6"/><circle cx="1096" cy="428" r="2" fill="#3f4a44" opacity=".6"/>
  </g>
  <g stroke="#3f4a44" stroke-width="2.6" fill="none" opacity=".7" transform="translate(0,26) scale(.8)">
    <path d="M300,520 C302,492 298,466 292,444"/>
    <path d="M292,478 C276,468 264,462 252,458 M292,460 C278,450 266,444 254,440"/>
  </g>
  <!-- 古风小木屋（远景） -->
  <g stroke="#6b6252" stroke-width="1.6" fill="none" opacity=".7">
    <path d="M700,524 L700,506 L724,506 L724,524 M686,524 L686,512 L700,512 L700,524 L724,524 L738,524"/>
    <line x1="686" y1="512" x2="700" y2="506" stroke="#6b6252" stroke-width="1"/>
  </g>
  <!-- 水中舟影/草 -->
  <g stroke="#8a9078" stroke-width="1.6" opacity=".6" fill="none">
    <path d="M216,560 C220,548 228,540 238,534"/><path d="M236,562 C240,552 246,546 254,540"/>
    <path d="M600,566 C604,556 610,548 618,542"/><path d="M620,568 C624,558 630,550 638,546"/>
    <path d="M1180,562 C1184,552 1192,544 1200,538"/><path d="M1202,564 C1206,554 1212,548 1220,542"/>
  </g>
  <!-- 轻淡水纹 -->
  <g stroke="#cfc6ab" stroke-width="1" opacity=".5" fill="none">
    <path d="M180,640 Q300,636 420,640"/><path d="M660,700 Q820,696 980,700"/><path d="M320,780 Q500,776 680,780"/>
  </g>
</svg></div>

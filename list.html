﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识卡 · 功能选择</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 50% 20%,#232c52,#10162e 55%,#05070f);min-height:100vh;color:#e8edff;font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.stage{position:relative;z-index:2;text-align:center;padding:24px;animation:fadeIn 1.2s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.sub{font-size:13px;letter-spacing:8px;color:rgba(232,237,255,.5);margin-bottom:16px}
h1{font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:10px;background:linear-gradient(100deg,#ffd76a,#ff9a76,#c084fc,#7dd3fc,#6ee7b7,#ffd76a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 7s linear infinite;margin-bottom:10px}
@keyframes grad{to{background-position:300% 0}}
.tip{font-size:12.5px;color:rgba(232,237,255,.55);letter-spacing:2px;margin-bottom:38px}
.choices{display:flex;flex-direction:column;gap:18px;align-items:center}
.ch{display:flex;align-items:center;justify-content:center;gap:14px;text-decoration:none;width:min(360px,84vw);padding:20px 22px;border-radius:18px;border:1.5px solid rgba(125,211,252,.4);background:rgba(255,255,255,.05);color:#e8edff;font-size:17px;font-weight:800;letter-spacing:3px;transition:.22s;text-align:center;position:relative;overflow:hidden}
.ch .big{font-size:28px}
.ch .desc{font-size:11.5px;color:rgba(232,237,255,.5);font-weight:400;letter-spacing:1px;line-height:1.6}
.ch:hover{border-color:#7dd3fc;transform:translateY(-3px);box-shadow:0 0 30px rgba(125,211,252,.45),0 10px 28px rgba(0,0,0,.4)}
.ch.home:hover{border-color:#ffd76a;box-shadow:0 0 30px rgba(255,215,106,.45),0 10px 28px rgba(0,0,0,.4)}
@media(max-width:560px){h1{letter-spacing:6px}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="stars" id="stars"></div>
<div class="stage">
  <div class="sub">B I O · 分 子 与 细 胞</div>
  <h1>知识卡</h1>
  <div class="tip">选择你要前往的功能</div>
  <div class="choices">
    <a class="ch" href="index.html"><span class="big">🏠</span>返回欢迎入口<span class="desc">回到动画欢迎页</span></a>
    <a class="ch" href="search.html"><span class="big">🔍</span>搜索卡片<span class="desc">输入卡片 ID 查找知识卡</span></a>
  </div>
</div>
<script>
/* ===== 背景星空 ===== */
(function(){
  var box=document.getElementById('stars');if(!box)return;
  var n=('ontouchstart' in window)||innerWidth<768?45:70,html='';
  for(var i=0;i<n;i++){
    var x=Math.random()*100,y=Math.random()*100,s=0.6+Math.random()*1.6,d=Math.random()*4;
    html+='<i style="position:absolute;left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;border-radius:50%;background:#cfe8ff;opacity:'+(0.3+Math.random()*0.6)+';animation:tw'+(d|0)+' '+(2+Math.random()*3)+'s infinite"></i>';
  }
  box.innerHTML=html;
  var css='';
  for(var k=0;k<5;k++){css+='@keyframes tw'+k+'{0%,100%{opacity:.2}50%{opacity:1}}';}
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
})();
/* ===== 鼠标霓虹粒子（轻量版：极小粒子 + 移动端自动降级） ===== */
(function(){
  var cv=document.getElementById('fx');
  if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d');
  var W,H,pts=[],mX=-999,mY=-999;
  var light=('ontouchstart' in window)||innerWidth<768; /* 移动端/小屏：更轻量 */
  var cap=light?36:70;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();addEventListener('resize',resize);
  var colors=['#7dd3fc','#c084fc','#6ee7b7','#ffd76a'];
  document.addEventListener('mousemove',function(e){mX=e.clientX;mY=e.clientY;});
  document.addEventListener('touchmove',function(e){if(e.touches[0]){mX=e.touches[0].clientX;mY=e.touches[0].clientY;}},{passive:true});
  setInterval(function(){
    if(mX<0)return;
    var n=light?1:2;
    for(var i=0;i<n;i++){
      pts.push({x:mX+(Math.random()-0.5)*14,y:mY+(Math.random()-0.5)*14,
        vx:(Math.random()-0.5)*0.7,vy:(Math.random()-0.5)*0.7-0.25,
        l:1,d:0.022+Math.random()*0.03,c:colors[(Math.random()*colors.length)|0],r:0.5+Math.random()*1.0});
    }
    if(pts.length>cap)pts.splice(0,pts.length-cap);
  },light?70:40);
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=pts.length-1;i>=0;i--){
      var p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.012;p.vx*=0.97;p.l-=p.d;
      if(p.l<=0){pts.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,p.l)*0.8;
      ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l+0.4,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
